<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarjeta navideña</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; background: #0b1b2b; color: #fff; }
    .box { max-width: 640px; margin: 0 auto; background: #12263a; border: 1px solid #2e4a67; border-radius: 12px; padding: 1.2rem; }
    .tip { font-size: 0.95rem; color: #cfe3ff; }
    a.btn { display: inline-block; margin: 0.5rem 0.5rem 0 0; padding: 0.6rem 0.9rem; background: #e63946; color: #fff; border-radius: 8px; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Tarjeta navideña</h1>
    <p class="tip">Usa la URL con parámetros para personalizar:
      <br>modelo: <code>?m=1</code> o <code>?m=2</code>,
      nombre: <code>&amp;nombre=Tu%20Nombre</code>.
    </p>
    <p>
      Ejemplos rápidos:
      <br><a class="btn" href="./modelo1.html?nombre=Mar%C3%ADa">Modelo 1 para María</a>
      <a class="btn" href="./modelo2.html?nombre=José">Modelo 2 para José</a>
    </p>
    <p class="tip">También puedes construir enlaces manualmente y enviarlos por WhatsApp o correo.</p>
  </div>
</body>
</html>
