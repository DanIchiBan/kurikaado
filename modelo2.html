<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarjeta navideña · Sorpresa</title>
  <style>
    :root { --bg: #0b1b2b; --card: #f5f3f0; --accent: #e63946; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); font-family: system-ui, sans-serif; }
    .scene { perspective: 1200px; cursor: pointer; }
    .card { width: 360px; height: 520px; position: relative; transform-style: preserve-3d; }
    .panel { position: absolute; width: 100%; height: 100%; border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .front { transform-origin: left; background: url('./assets/portada02.jpg') }
    .back { transform: translateZ(-1px); background-size: cover; background-position: center; }
    .open { animation: open 2s ease forwards; }
    @keyframes open {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(-140deg); }
      100% { transform: rotateY(-180deg); }
    }
    .content { position: absolute; inset: 0; padding: 1.2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; background: rgba(255,255,255,0.2); border-radius: 12px; }
    h1 { margin: 0 0 0.6rem; margin-top: -100px; color: #fff; }
    p { color: #fff; width: 200px; }
    .badge { margin-top: 0.8rem; background: var(--accent); color: #fff; padding: 0.4rem 0.7rem; border-radius: 20px; font-weight: 600; }
    .tip { margin-top: 1rem; font-size: 0.9rem; color: #666; }

    .firma {
      position: absolute;   /* se coloca respecto al contenedor */
      bottom: 80px;         /* distancia desde abajo */
      right: 40px;          /* distancia desde la derecha */
      font-family: 'Cursive', sans-serif; /* estilo manuscrito */
      font-size: 1.2rem;
      color: #fff;          /* color de la firma */
      opacity: 0;
      animation: aparecer 2s ease forwards 1.5s; /* aparece después de 1.5s */
    }    
    @keyframes aparecer {
    to { opacity: 0.8; }
    }

  </style>
</head>
<body>
  <div class="scene" id="scene">
    <div class="card">
      <div class="panel back">
        <div class="content">
          <h1>¡Feliz Navidad, <span id="nombre">Amigx</span>!</h1>
          <p id="frase"></p>
          <!-- <div class="badge">Tarjeta sorpresa 🎲</div>
          <p class="tip">(Haz clic para abrir y escuchar 🎶)</p>  -->
          <div class="firma">Dan</div>
        </div>
      </div>
      <div class="panel front"></div>
    </div>
  </div>

  <audio id="sound" preload="auto"></audio>

  <script>
    // Listas de opciones
    const fondos = [
      "./assets/fondo01.jpg",
      "./assets/fondo02.jpg",
      "./assets/fondo03.jpg",
      "./assets/fondo04.jpg"
    ];

    const frases = [
      "Que la magia de la Navidad ilumine tu hogar con alegría y esperanza.",
      "Que la paz y el amor de esta Navidad acompañen todos tus días.",
      "Que la Navidad te regale momentos inolvidables junto a quienes más quieres.",
      "Que el espíritu navideño te envuelva en luz, calor y sonrisas.",
      "Que cada campana que suene esta Navidad traiga consigo un deseo cumplido.",
      "Que la luz de la Navidad ilumine tu hogar y llene tu corazón de amor.",
      "En esta Navidad, deja que la paz abrace cada rincón de tu vida.",
      "Que esta Navidad te encuentre rodeado de abrazos y buenos momentos.",
      "Que la alegría de estas fiestas dure todo el año."
    ];

    const audios = [
      "./assets/audio01.mp3",
      "./assets/audio02.mp3",
      "./assets/audio03.mp3",
      "./assets/audio04.mp3",
      "./assets/audio05.mp3",
      "./assets/audio06.mp3",
      "./assets/audio07.mp3",
      "./assets/audio08.mp3",
      "./assets/audio09.mp3"      
    ];

    // Función para elegir al azar
    function elegirAlAzar(lista) {
      return lista[Math.floor(Math.random() * lista.length)];
    }

    // Selecciones aleatorias
    const fondoElegido = elegirAlAzar(fondos);
    const fraseElegida = elegirAlAzar(frases);
    const audioElegido = elegirAlAzar(audios);

    // Aplicar fondo y frase
    document.querySelector(".back").style.backgroundImage = `url("${fondoElegido}")`;
    document.getElementById("frase").textContent = fraseElegida;

    // Personalización por nombre en URL
    const params = new URLSearchParams(location.search);
    const raw = params.get("nombre");
    const nombre = raw ? decodeURIComponent(raw) : "Amigx";
    document.getElementById("nombre").textContent = nombre;

    // Configurar audio
    const sound = document.getElementById("sound");
    sound.src = audioElegido;

    // Al hacer clic en la tarjeta: abrir + reproducir sonido
    const scene = document.getElementById("scene");
    const front = document.querySelector(".front");

    scene.addEventListener("click", () => {
      front.classList.add("open");   // inicia animación
      sound.play().catch(() => {
        // Si el navegador bloquea autoplay, mostramos controles
        sound.setAttribute("controls", "true");
      });
    });
  </script>
</body>
</html>
