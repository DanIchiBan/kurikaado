<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarjeta navideña · Modelo 2</title>
  <style>
    :root { --bg: #112; --accent: #06d6a0; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: radial-gradient(800px 400px at 50% 30%, #1d2a3a, #0c1624); font-family: system-ui, sans-serif; color: #eef; }
    .wrap { width: 360px; padding: 1.2rem; border: 1px solid #2e4a67; border-radius: 12px; background: rgba(18,38,58,0.7); backdrop-filter: blur(4px); animation: fade 1200ms ease forwards; opacity: 0; }
    h1 { margin: 0 0 0.6rem; }
    .accent { color: var(--accent); font-weight: 700; }
    .chip { margin-top: 0.8rem; display: inline-block; background: var(--accent); color: #062; padding: 0.4rem 0.7rem; border-radius: 20px; font-weight: 700; }
    @keyframes fade { to { opacity: 1; transform: translateY(0); } from { opacity: 0; transform: translateY(10px); } }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>¡Brilla, <span class="accent" id="nombre">Amigx</span>!</h1>
    <p>Que cada proyecto sea un puente entre mundos.</p>
    <div class="chip">Modelo 2</div>
    <audio id="sound" src="./assets/sonido.mp3" preload="auto" controls style="margin-top:1rem; width:100%"></audio>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const raw = params.get("nombre");
    const nombre = raw ? decodeURIComponent(raw) : "Amigx";
    document.getElementById("nombre").textContent = nombre;
  </script>
</body>
</html>
