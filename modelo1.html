<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tarjeta navideña · Modelo 1</title>
  <style>
    :root { --bg: #0b1b2b; --card: #f5f3f0; --accent: #e63946; }
    body { margin: 0; height: 100vh; display: grid; place-items: center; background: var(--bg); font-family: system-ui, sans-serif; }
    .scene { perspective: 1200px; }
    .card { width: 360px; height: 520px; position: relative; transform-style: preserve-3d; }
    .panel { position: absolute; width: 100%; height: 100%; background: var(--card); border-radius: 12px; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    .front { transform-origin: left; background: url("./assets/fondo.jpg"); }
    .back { transform: translateZ(-1px); background: #fff; }
    .open { animation: open 2s ease forwards; }
    @keyframes open {
      0% { transform: rotateY(0deg); }
      50% { transform: rotateY(-140deg); }
      100% { transform: rotateY(-180deg); }
    }
    .content { position: absolute; inset: 0; padding: 1.2rem; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
    h1 { margin: 0 0 0.6rem; color: #12263a; }
    p { color: #334; }
    .badge { margin-top: 0.8rem; background: var(--accent); color: #fff; padding: 0.4rem 0.7rem; border-radius: 20px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="scene">
    <div class="card">
      <div class="panel back">
        <div class="content">
          <h1>¡Feliz Navidad, <span id="nombre">Amigx</span>!</h1>
          <p>Que la primera luz del año te encuentre creando.</p>
          <div class="badge">Modelo 1</div>
        </div>
      </div>
      <div class="panel front open"></div>
    </div>
  </div>

  <audio id="sound" src="./assets/sonido.mp3" preload="auto"></audio>

  <script>
    // Leer el nombre desde la URL: ?nombre=María
    const params = new URLSearchParams(location.search);
    const raw = params.get("nombre");
    const nombre = raw ? decodeURIComponent(raw) : "Amigx";
    document.getElementById("nombre").textContent = nombre;

    // Reproducir sonido al terminar la animación de apertura
    const front = document.querySelector(".front");
    const sound = document.getElementById("sound");
    front.addEventListener("animationend", () => {
      // Requiere interacción en algunos navegadores móviles
      sound.play().catch(() => {
        // Si el navegador bloquea autoplay, mostramos un botón:
        const btn = document.createElement("button");
        btn.textContent = "Escuchar";
        btn.style.marginTop = "1rem";
        btn.onclick = () => sound.play();
        document.querySelector(".content").appendChild(btn);
      });
    });
  </script>
</body>

</html>
